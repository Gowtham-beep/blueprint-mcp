[project]
name = "blueprint-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GowthamN", email = "gn86923@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "mcp[cli]>=2,<3",
    "pydantic>=2.14.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
blueprint-mcp = "blueprint_mcp:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
